    HOW TO ADD YOUR OWN PHOTOS
    ---------------------------------------------------------
    Each photo hangs on a little clothespin along a string, in
    rows of 4. To add your own photo to a card:
      1. Put your photo files inside the /images folder next to
         this file.
      2. Set that card's <img> src, e.g. src="images/photo1.jpg"
         — the dashed placeholder disappears automatically.
      3. Replace the "Write a memory here…" caption below the
         photo with your own comment.
    There are 12 photo slots below (3 rows of 4) — delete any
    you don't need, or add more <figure> cards to a row.
  -->
